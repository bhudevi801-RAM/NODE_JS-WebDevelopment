<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Login Form</title>
    <link rel="stylesheet" href="css/register.css">
        <script src="JavaScript/script.js"></script>
</head>

<body>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Shared Website Header Element -->
    <header class="main-header">
        <div class="website-title">
            <span class="logo">📚</span>
            <h1>E-Book Management System</h1>
        </div>
    </header>

    <!-- Global Navigation System Bar -->
    <nav class="navbar navbar-expand-lg bg-dark navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">📚 E-Book Store</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="catalogue.html">Catalog</a></li>
                    <li class="nav-item"><a class="nav-link" href="login.html">Login</a></li>
                    <li class="nav-item"><a class="nav-link" href="registration.html">Register</a></li>
                    <li class="nav-item"><a class="nav-link" href="cart.html">Cart</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content Form Section Using Bootstrap Grid Structure -->
    <main class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-6 col-lg-4">
                
                <!-- Login Box Structured inside a Bootstrap Card Element -->
                <div class="card shadow-sm border p-4">
                    <div class="card-body">
                        <h1 class="h3 card-title text-center mb-4">Login Form</h1>

                        <form action="login.html" method="post" onsubmit="return loginValidity()">

    <div class="mb-3">
        <label for="username" class="form-label fw-semibold">
            User Name
        </label>

        <input type="text"
               class="form-control"
               id="username"
               name="username"
               placeholder="Enter Username"
               required>
    </div>

    <div class="mb-3">
        <label for="password" class="form-label fw-semibold">
            Password
        </label>

        <input type="password"
               class="form-control"
               id="password"
               name="password"
               placeholder="Enter Password"
               required>
    </div>

    <div class="d-grid gap-2 mt-4">

        <button type="submit" class="btn btn-primary w-100">
            Login
        </button>

        <button type="reset" class="btn btn-outline-secondary w-100">
            Reset
        </button>

    </div>

</form>

                        <!-- Context Links Wrapper -->
                        <div class="text-center mt-4 pt-2 border-top small">
                            <a href="forgotpassword.html" class="text-decoration-none d-block mb-2 text-danger">Forgot Password?</a>
                            <a href="registration.html" class="text-decoration-none fw-semibold">New User? Register Here</a>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <footer class="mt-5 py-3 text-center border-top">
        <p>© 2026 E-Book Management System  | BHUDEVI TAMMISHETTY </p>
    </footer>

</body>
</html>
