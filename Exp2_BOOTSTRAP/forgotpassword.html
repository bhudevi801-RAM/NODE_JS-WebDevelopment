<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
     
    <!-- Main Center-Aligned Grid Container -->
    <main class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-6 col-lg-4">
                
                <!-- Reset Module Styled Inside a Card Element -->
                <div class="card shadow-sm border p-4">
                    <div class="card-body">
                        
                        <h1 class="h3 card-title text-center mb-2">Forgot Password?</h1>
                        <h3 class="h6 text-center text-muted mb-3">No worries! We got you.</h3>

                        <p class="card-text text-center text-secondary small mb-4">
                            Enter your registered email address below.
                            We will send you a password reset link.
                        </p>

                        <form>
                            <!-- Structured Email Control Element Wrapper -->
                            <div class="mb-3">
                                <label for="resetEmail" class="form-label fw-semibold">Email Address</label>
                                <input 
                                    type="email" 
                                    class="form-control" 
                                    id="resetEmail" 
                                    placeholder="Enter your email" 
                                    required
                                >
                            </div>

                            <!-- Styled Action Buttons Layout Grid Block -->
                            <div class="d-grid gap-2 mt-4">
                                <button type="submit" class="btn btn-primary w-100">Send Reset Link</button>
                                <button type="reset" class="btn btn-outline-secondary w-100">Clear</button>
                            </div>
                        </form>

                        <!-- Context Return Anchor Wrap Element -->
                        <div class="text-center mt-4 pt-2 border-top">
                            <a href="login.html" class="text-decoration-none small fw-semibold">← Back to Login</a>
                        </div>

                    </div>
                </div>

            </div>
        </div>
    </main>

</body>
</html>
